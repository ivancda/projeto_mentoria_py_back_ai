<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Reviewer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <h1>code reviewer</h1>

  <div class="container">
    <div class="panel">
      <label>código</label>
      <textarea id="code-input" placeholder="cole seu código aqui..."></textarea>
      <button id="review-btn">revisar</button>
    </div>

    <div class="panel">
      <label>resultado</label>
      <div id="review-output" class="output"></div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
