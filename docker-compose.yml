services:

  app:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      # usa urllib nativo do Python — não depende de curl/wget na imagem slim
      test: ["CMD", "python", "-c", "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s # intervalo de check
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
    # lê as variáveis do arquivo .env e injeta como variáveis de ambiente no container
      - .env
    depends_on:
      db:
        # só sobe o app quando o banco passar no healthcheck (antes era só "db iniciou")
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  db:
    image: postgres:16
    env_file:
    # o postgres lê POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB daqui
      - .env
    ports:
      - "5432:5432"
    volumes:
      # monta o volume nomeado no diretório onde o postgres salva os dados
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # pg_isready: comando nativo do postgres que checa se o banco está aceitando conexões
      # -U e -d: usa as variáveis do .env para saber qual usuário/banco testar
      interval: 5s   # roda o teste a cada 5 segundos
      timeout: 5s    # se o teste não responder em 5s, considera falha
      retries: 5     # após 5 falhas consecutivas, marca o container como "unhealthy"

  ollama:
    image: ollama/ollama:latest
    container_name: code-reviewer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=${OLLAMA_URL}
    entrypoint: >
      sh -c "
        echo 'baixando modelos...' &&
        ollama pull ${OLLAMA_MODEL} &&
        echo 'modelos baixados com sucesso meu fera.'
      "

volumes:
  # declara o volume nomeado — o Docker gerencia onde ele fica no host
  # sem isso, os dados do banco são perdidos quando o container é removido
  postgres_data:
  ollama_data: